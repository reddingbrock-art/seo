name: Inject Site Verification
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject google-site-verification into existing pages
        run: |
          find docs -name "*.html" | while read f; do
            if ! grep -q "google-site-verification" "$f"; then
              sed -i 's|<link rel="canonical"[^>]*>|&\n<meta name="google-site-verification" content="fbPxocvFaeeB1gFWna_BrU4i0RDoF1ZYwzLrxDWxv9w">|' "$f"
            fi
          done

      - name: Commit patched pages
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add docs/
          git diff --staged --quiet || git commit -m "inject google-site-verification into remaining pages"
          git push
