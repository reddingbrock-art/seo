name: Inject GTM into SEO Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inject-gtm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Inject GTM and remove old GA4
        run: |
          python3 - <<'PYEOF'
          import os, re

          GTM_HEAD = (
              '<!-- Google Tag Manager -->\n'
              '<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({"gtm.start":'
              'new Date().getTime(),event:"gtm.js"});var f=d.getElementsByTagName(s)[0],'
              'j=d.createElement(s),dl=l!="dataLayer"?"&l="+l:"";j.async=true;j.src='
              '"https://www.googletagmanager.com/gtm.js?id="+i+dl;'
              'f.parentNode.insertBefore(j,f);})(window,document,"script","dataLayer","GTM-TCZNRHLF");</script>\n'
              '<!-- End Google Tag Manager -->'
          )

          GTM_BODY = (
              '<!-- Google Tag Manager (noscript) -->\n'
              '<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TCZNRHLF"'
              ' height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>\n'
              '<!-- End Google Tag Manager (noscript) -->'
          )

          for root, dirs, files in os.walk('docs'):
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                      html = f.read()

                  html = re.sub(
                      r'<script async src="https://www\.googletagmanager\.com/gtag/js\?id=G-6SMPNJH9F7">'
                      r'</script>\s*<script>window\.dataLayer.*?G-6SMPNJH9F7[^<]*</script>',
                      '',
                      html,
                      flags=re.DOTALL
                  )

                  if 'GTM-TCZNRHLF' not in html:
                      html = html.replace('<head>', '<head>\n' + GTM_HEAD, 1)
                      html = html.replace('<body>', '<body>\n' + GTM_BODY, 1)

                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(html)

          print('Done.')
          PYEOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Inject GTM-TCZNRHLF into all SEO pages"
          git push
